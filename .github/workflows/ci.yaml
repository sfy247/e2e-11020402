# Generated by the developer portal (templates/_shared/cicd).
# Thin caller: build, test, scan and publish live in the platform's reusable
# workflow, so every service gets fixes in one place. No secrets needed: the
# image goes to GHCR with the built-in token, and Argo CD Image Updater rolls
# new images out to dev.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  ci:
    uses: sfy247/omarchy-k8s-portal/.github/workflows/dotnet-service.yaml@main
    with:
      project-path: src/e2e-11020402
